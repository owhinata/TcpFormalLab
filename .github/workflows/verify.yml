name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21.0.8+9.0.LTS'
      - name: Install fixed formal tools
        run: ./scripts/setup.sh
      - name: Check environment
        run: ./scripts/check-env.sh
      - name: Build and test C#
        run: ./scripts/test-csharp.sh
      - name: Check normal TLA+ model
        run: ./scripts/check-tla.sh
      - name: Build Lean proofs
        run: ./scripts/check-lean.sh
